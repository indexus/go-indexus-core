# Optional Linux-cgroup lab (heavier on Mac than peer_lab.sh because of Docker Desktop VM).
# Prefer ./scripts/local/peer_lab.sh on macOS.
#
# If you use this: cap Docker Desktop to ≤2 CPU / ≤2 GiB in Settings first.
services:
  issuer:
    image: amazonlinux:2023
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ../../bin/issuer-linux:/usr/local/bin/issuer:ro
      - ../../scripts/local:/scripts/local:ro
      - ../../.data-local-docker:/data
    ports:
      - "22000:22000"
    environment:
      GOMAXPROCS: "1"
      GOMEMLIMIT: "200MiB"
    command: ["bash", "-c", "echo 'Build issuer-linux + wire spawn via host scripts; prefer peer_lab.sh on Mac'"]
